# Publica el prototipo jugable en GitHub Pages en cada push a main.
#
# Se construye desde el código: lo que se despliega corre el motor real, no una
# copia de las reglas para web.
#
# Requisito una sola vez: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:proto
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp apps/prototype/dist/shadow-logic.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
